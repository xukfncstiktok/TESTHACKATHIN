<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cosmos — Three.js Orbital Simulation</title>
<style>
  :root {
    --bg: #020617;
    --hud: rgba(10, 15, 30, 0.65);
    --hud-border: rgba(148, 163, 184, 0.2);
    --accent: #38bdf8;
    --danger: #ef4444;
    --warn: #f59e0b;
    --text: #e2e8f0;
    --text-dim: rgba(226, 232, 240, 0.55);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
  }

  canvas {
    display: block;
    position: fixed;
    inset: 0;
  }

  #hud {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    display: grid;
    gap: 12px;
    max-width: 320px;
    pointer-events: none;
  }

  .hud-panel {
    pointer-events: auto;
    background: var(--hud);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--hud-border);
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  .hud-panel h2 {
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .hud-panel .value {
    font-size: 1.4rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .hud-panel .value.good { color: #22c55e; }
  .hud-panel .value.warn { color: var(--warn); }
  .hud-panel .value.danger { color: var(--danger); }

  .controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 10px;
    pointer-events: auto;
  }

  .chip {
    background: var(--hud);
    backdrop-filter: blur(18px);
    border: 1px solid var(--hud-border);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 0.75rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .chip:hover {
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
  }

  .chip.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  #loading {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    transition: opacity 0.6s ease;
  }

  #loading.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(148, 163, 184, 0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #error {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 60;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.8rem;
    max-width: 320px;
    backdrop-filter: blur(12px);
    display: none;
  }

  @media (max-width: 640px) {
    #hud { left: 10px; top: 10px; max-width: 220px; }
    .hud-panel { padding: 10px 12px; }
    .hud-panel .value { font-size: 1.1rem; }
    .controls { gap: 6px; }
    .chip { padding: 6px 10px; font-size: 0.7rem; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div style="font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim);">
    Initializing Cosmos...
  </div>
</div>

<div id="error"></div>

<div id="hud">
  <div class="hud-panel">
    <h2>Mission Elapsed Time</h2>
    <div class="value" id="met">00:00:00</div>
  </div>
  <div class="hud-panel">
    <h2>Earth Status</h2>
    <div class="value good" id="earthStatus">NOMINAL</div>
  </div>
  <div class="hud-panel">
    <h2>Frame Rate</h2>
    <div class="value" id="fps">60 FPS</div>
  </div>
</div>

<div class="controls">
  <button class="chip active" data-speed="1">1x</button>
  <button class="chip" data-speed="2">2x</button>
  <button class="chip" data-speed="5">5x</button>
  <button class="chip" data-speed="0">Pause</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
// ============================================
// COSMOS — Three.js Orbital Simulation Engine
// ============================================

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------- Configuration ----------
const CONFIG = {
  assetBase: './assets/',
  sunScale: 8,
  earthScale: 2,
  moonScale: 0.6,
  earthOrbitRadius: 40,
  moonOrbitRadius: 5,
  earthRotationSpeed: 0.4,
  earthOrbitSpeed: 0.08,
  moonOrbitSpeed: 0.25,
  sunRotationSpeed: 0.05,
  fallbackColors: {
    sun: 0xffaa00,
    earth: 0x22c55e,
    moon: 0x9ca3af,
  },
};

// ---------- State ----------
const state = {
  time: 0,
  speed: 1,
  loaded: false,
  sun: null,
  earth: null,
  moon: null,
  earthOrbit: null,
  moonOrbit: null,
  fallback: { sun: false, earth: false, moon: false },
};

// ---------- Scene Setup ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color('#020617');
scene.fog = new THREE.FogExp2('#020617', 0.0008);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(30, 20, 50);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// ---------- Lighting ----------
const ambient = new THREE.AmbientLight(0x1e293b, 0.6);
scene.add(ambient);

const starlight = new THREE.AmbientLight(0xffffff, 0.15);
scene.add(starlight);

const sunLight = new THREE.DirectionalLight(0xfff7ed, 3.5);
sunLight.position.set(100, 40, 60);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 400;
sunLight.shadow.camera.left = -80;
sunLight.shadow.camera.right = 80;
sunLight.shadow.camera.top = 80;
sunLight.shadow.camera.bottom = -80;
sunLight.shadow.bias = -0.0005;
scene.add(sunLight);

const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.8);
rimLight.position.set(-40, 20, -40);
scene.add(rimLight);

// ---------- Stars ----------
function createStars() {
  const count = 4000;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    const r = 300 + Math.random() * 400;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);

    const c = new THREE.Color();
    c.setHSL(0.6 + Math.random() * 0.2, 0.4, 0.7 + Math.random() * 0.3);
    colors[i * 3] = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;

    sizes[i] = 0.5 + Math.random() * 1.5;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.PointsMaterial({
    size: 1.2,
    vertexColors: true,
    transparent: true,
    opacity: 0.85,
    sizeAttenuation: true,
  });

  scene.add(new THREE.Points(geo, mat));
}
createStars();

// ---------- Orbit Lines ----------
function createOrbitLine(radius, color = 0x334155) {
  const points = [];
  const segments = 128;
  for (let i = 0; i <= segments; i++) {
    const angle = (i / segments) * Math.PI * 2;
    points.push(new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.35 });
  return new THREE.Line(geo, mat);
}

const earthOrbitLine = createOrbitLine(CONFIG.earthOrbitRadius, 0x22c55e);
scene.add(earthOrbitLine);

const moonOrbitLine = createOrbitLine(CONFIG.moonOrbitRadius, 0x94a3b8);
scene.add(moonOrbitLine);

// ---------- Fallback Materials ----------
function createFallbackMaterial(colorHex) {
  return new THREE.MeshStandardMaterial({
    color: colorHex,
    roughness: 0.7,
    metalness: 0.1,
  });
}

function createFallbackMesh(radius, colorHex, emissive = 0x000000) {
  const geo = new THREE.SphereGeometry(radius, 64, 64);
  const mat = new THREE.MeshStandardMaterial({
    color: colorHex,
    roughness: 0.7,
    metalness: 0.1,
    emissive,
    emissiveIntensity: emissive === 0x000000 ? 0 : 0.6,
  });
  return new THREE.Mesh(geo, mat);
}

// ---------- Scene Objects ----------
const sunGroup = new THREE.Group();
scene.add(sunGroup);

const earthOrbitGroup = new THREE.Group();
scene.add(earthOrbitGroup);

const moonOrbitGroup = new THREE.Group();
scene.add(moonOrbitGroup);

state.earthOrbit = earthOrbitGroup;
state.moonOrbit = moonOrbitGroup;

// Sun
state.sun = new THREE.Group();
const sunMesh = createFallbackMesh(CONFIG.sunScale, CONFIG.fallbackColors.sun, 0xffaa00);
sunMesh.castShadow = true;
sunMesh.receiveShadow = true;
state.sun.add(sunMesh);
state.sun.userData.mesh = sunMesh;
state.sun.userData.isFallback = true;
sunGroup.add(state.sun);

// Sun glow
const sunGlowGeo = new THREE.SphereGeometry(CONFIG.sunScale * 1.15, 32, 32);
const sunGlowMat = new THREE.MeshBasicMaterial({
  color: 0xffaa00,
  transparent: true,
  opacity: 0.12,
  side: THREE.BackSide,
});
const sunGlow = new THREE.Mesh(sunGlowGeo, sunGlowMat);
state.sun.add(sunGlow);

// Earth
state.earth = new THREE.Group();
const earthMesh = createFallbackMesh(CONFIG.earthScale, CONFIG.fallbackColors.earth);
earthMesh.castShadow = true;
earthMesh.receiveShadow = true;
state.earth.add(earthMesh);
state.earth.userData.mesh = earthMesh;
state.earth.userData.isFallback = true;
earthOrbitGroup.add(state.earth);

// Moon
state.moon = new THREE.Group();
const moonMesh = createFallbackMesh(CONFIG.moonScale, CONFIG.fallbackColors.moon);
moonMesh.castShadow = true;
moonMesh.receiveShadow = true;
state.moon.add(moonMesh);
state.moon.userData.mesh = moonMesh;
state.moon.userData.isFallback = true;
moonOrbitGroup.add(state.moon);

// Position Earth orbit
earthOrbitGroup.position.x = CONFIG.earthOrbitRadius;

// ---------- Asset Loading ----------
const loader = new GLTFLoader();

async function loadModel(path, fallbackColor, emissive = 0x000000) {
  try {
    const gltf = await loader.loadAsync(path);
    const model = gltf.scene;
    model.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });
    return { model, fallback: false };
  } catch (err) {
    console.warn(`[Cosmos] Failed to load ${path}:`, err.message);
    return { model: null, fallback: true };
  }
}

async function initAssets() {
  const [sunResult, earthResult, moonResult] = await Promise.all([
    loadModel(`${CONFIG.assetBase}sun.glb`, CONFIG.fallbackColors.sun, 0xffaa00),
    loadModel(`${CONFIG.assetBase}earth.glb`, CONFIG.fallbackColors.earth),
    loadModel(`${CONFIG.assetBase}moon.glb`, CONFIG.fallbackColors.moon),
  ]);

  // Sun
  if (!sunResult.fallback && sunResult.model) {
    const old = state.sun.userData.mesh;
    if (old) state.sun.remove(old);
    sunResult.model.scale.setScalar(CONFIG.sunScale);
    state.sun.add(sunResult.model);
    state.sun.userData.mesh = sunResult.model;
    state.sun.userData.isFallback = false;
    state.fallback.sun = false;
  }

  // Earth
  if (!earthResult.fallback && earthResult.model) {
    const old = state.earth.userData.mesh;
    if (old) state.earth.remove(old);
    earthResult.model.scale.setScalar(CONFIG.earthScale);
    state.earth.add(earthResult.model);
    state.earth.userData.mesh = earthResult.model;
    state.earth.userData.isFallback = false;
    state.fallback.earth = false;
  }

  // Moon
  if (!moonResult.fallback && moonResult.model) {
    const old = state.moon.userData.mesh;
    if (old) state.moon.remove(old);
    moonResult.model.scale.setScalar(CONFIG.moonScale);
    state.moon.add(moonResult.model);
    state.moon.userData.mesh = moonResult.model;
    state.moon.userData.isFallback = false;
    state.fallback.moon = false;
  }

  const anyFallback = sunResult.fallback || earthResult.fallback || moonResult.fallback;
  if (anyFallback) {
    const missing = [];
    if (sunResult.fallback) missing.push('Sun');
    if (earthResult.fallback) missing.push('Earth');
    if (moonResult.fallback) missing.push('Moon');
    showError(`Using fallback geometries for: ${missing.join(', ')}. Ensure GLB files exist in /assets/.`);
  }

  state.loaded = true;
  document.getElementById('loading').classList.add('hidden');
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 8000);
}

// ---------- Controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 10;
controls.maxDistance = 200;
controls.target.set(CONFIG.earthOrbitRadius, 0, 0);
controls.update();

// ---------- UI ----------
const metEl = document.getElementById('met');
const fpsEl = document.getElementById('fps');
const earthStatusEl = document.getElementById('earthStatus');
const startTime = performance.now();
let frameCount = 0;
let lastFpsUpdate = startTime;

function updateHUD() {
  const elapsed = (performance.now() - startTime) / 1000;
  const h = Math.floor(elapsed / 3600).toString().padStart(2, '0');
  const m = Math.floor((elapsed % 3600) / 60).toString().padStart(2, '0');
  const s = Math.floor(elapsed % 60).toString().padStart(2, '0');
  metEl.textContent = `${h}:${m}:${s}`;

  frameCount++;
  const now = performance.now();
  if (now - lastFpsUpdate >= 500) {
    const fps = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
    fpsEl.textContent = `${fps} FPS`;
    fpsEl.className = 'value ' + (fps >= 55 ? 'good' : fps >= 30 ? 'warn' : 'danger');
    frameCount = 0;
    lastFpsUpdate = now;
  }

  const health = state.earth ? 100 : 0;
  earthStatusEl.textContent = state.loaded ? 'NOMINAL' : 'INITIALIZING';
  earthStatusEl.className = 'value ' + (state.loaded ? 'good' : 'warn');
}

// Speed controls
document.querySelectorAll('.chip').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    state.speed = parseFloat(btn.dataset.speed);
  });
});

// ---------- Resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Animation Loop ----------
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.1);
  const t = state.time;

  if (state.loaded) {
    // Sun rotation
    state.sun.rotation.y += dt * CONFIG.sunRotationSpeed * state.speed;

    // Earth orbit + rotation
    earthOrbitGroup.rotation.y += dt * CONFIG.earthOrbitSpeed * state.speed;
    state.earth.rotation.y += dt * CONFIG.earthRotationSpeed * state.speed;

    // Moon orbit
    moonOrbitGroup.rotation.y += dt * CONFIG.moonOrbitSpeed * state.speed;
  }

  state.time += dt * state.speed;
  controls.update();
  updateHUD();
  renderer.render(scene, camera);
}

// ---------- Boot ----------
initAssets()
  .then(() => {
    animate();
  })
  .catch((err) => {
    console.error('[Cosmos] Boot failed:', err);
    showError(`Initialization error: ${err.message}`);
    state.loaded = true;
    document.getElementById('loading').classList.add('hidden');
    animate();
  });
</script>
</body>
</html>
